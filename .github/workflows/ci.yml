name: Fyne GUI CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example, v1.0.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - name: Check formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v
      - name: Build smoke test
        env:
          CGO_ENABLED: '1'
        run: go build -o /tmp/hex-loader .

  build:
    name: Build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'macos' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact: hex-loader-linux-x64
          - os: macos-latest
            platform: macos
            artifact: hex-loader-macos
          - os: windows-latest
            platform: windows-x64
            artifact: hex-loader-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config
      - name: Configure MinGW compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gccPath = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin\gcc.exe"
          if (-not (Test-Path $gccPath)) {
            $gccPath = "C:\msys64\mingw64\bin\gcc.exe"
          }
          if (-not (Test-Path $gccPath)) {
            $found = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "gcc.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*mingw64*" } |
              Select-Object -First 1
            if ($found) { $gccPath = $found.FullName }
          }
          if (-not (Test-Path $gccPath)) {
            throw "MinGW gcc.exe not found"
          }
          $gccDir = Split-Path $gccPath -Parent
          $gccUnix = $gccPath -replace '\\', '/'
          $gccDirUnix = $gccDir -replace '\\', '/'
          $pkgConfig = (Join-Path (Split-Path $gccDir -Parent) "lib\pkgconfig") -replace '\\', '/'
          "CC=$gccUnix" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfig" >> $env:GITHUB_ENV
          "$gccDirUnix" >> $env:GITHUB_PATH
      - name: Build GUI binary
        shell: bash
        env:
          CGO_ENABLED: '1'
          VERSION: ${{ inputs.release_tag || github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$ARTIFACT" .
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
